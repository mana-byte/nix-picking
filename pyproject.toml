[project]
name = "nix-picking"
version = "0.1"
description = "Simple beginner friendly review tool for nixpkgs to automate repetitive tasks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "nix-manipulator>=0.1.3",
    "pygithub>=2.8.1",
    "rich>=14.3.3",
    "textdistance>=4.6.3",
    "toml>=0.10.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-nix>=0.1.0",
]

[project.scripts]
nix-pick = "nix_picking.cli.entrypoint:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "coverage>=7.13.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nix_picking"]
