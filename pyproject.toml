[project]
name = "nix-picking"
version = "0.1"
description = "Simple beginner friendly review tool for nixpkgs to automate repetitive tasks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nix-manipulator>=0.1.3",
    "pygithub>=2.8.1",
    "textdistance>=4.6.3",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "coverage>=7.13.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nix_picking"]
